# Installer smoke test on throwaway GitHub-hosted VMs (fork-only, manual).
# Installs ONLY the already-published release assets of the given tag after
# verifying SHA-256 against the official download-manifest.json. Nothing is
# built or repackaged here. Results are "virtual machine" evidence, not
# real-device acceptance: runners are admin with UAC/SmartScreen UI not
# observable.
name: Installer Smoke (VM)

on:
  # workflow_dispatch is the intended entry point. The narrow push trigger only
  # registers this non-default-branch workflow and re-runs it with defaults
  # when the smoke scripts themselves change on the dedicated branch.
  push:
    branches: [test/installer-smoke]
    paths:
      - .github/workflows/installer-smoke.yml
      - .github/installer-smoke/**
  workflow_dispatch:
    inputs:
      tag:
        description: FyAgent release tag to test (vX.Y.Z)
        required: true
        default: v0.4.9
        type: string
      source_repo:
        description: Repository that published the release
        required: true
        default: fy-agent/fyagent
        type: string
      scenario:
        description: "fyagent-e2e: clean VM, install tools through FyAgent's own UI; npm-preinstall: install tools via npm/official installer first, then compare FyAgent detection"
        required: true
        default: fyagent-e2e
        type: choice
        options:
          - fyagent-e2e
          - npm-preinstall
      agents:
        description: "fyagent-e2e only: comma-separated product names to install (empty = all)"
        required: false
        default: ""
        type: string
      churn_dir:
        description: "fyagent-e2e Windows only: create sibling directories here while installs run (repro for directory-identity checks), e.g. C:\\ProgramData"
        required: false
        default: ""
        type: string
      artifact_run_id:
        description: "Optional: install the unsigned fork build from this fork-build.yml run id instead of the release assets (summary is marked non-release)"
        required: false
        default: ""
        type: string
      restart_explorer:
        description: "Windows only: restart explorer.exe before FyAgent starts if the desktop shell view is missing (test-environment preparation)"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - arm64
          - all

permissions:
  contents: read
  actions: read

concurrency:
  group: installer-smoke-${{ inputs.artifact_run_id && format('fork-{0}', inputs.artifact_run_id) || inputs.tag || 'v0.4.9' }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  smoke:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
            platform: windows
            arch: x64
          - id: windows-arm64
            runner: windows-11-vs2026-arm
            platform: windows
            arch: arm64
          - id: macos-arm64
            runner: macos-latest
            platform: macos
            arch: universal
    env:
      SMOKE_ID: ${{ matrix.id }}
      SMOKE_TAG: ${{ inputs.tag || 'v0.4.9' }}
      SMOKE_REPO: ${{ inputs.source_repo || 'fy-agent/fyagent' }}
      SMOKE_PLATFORM: ${{ matrix.platform }}
      SMOKE_ARCH: ${{ matrix.arch }}
      SMOKE_OUT: ${{ github.workspace }}/smoke-out
      SMOKE_SCENARIO: ${{ inputs.scenario || 'fyagent-e2e' }}
      SMOKE_E2E_WAIT_S: "240"
      SMOKE_E2E_AGENTS: ${{ inputs.agents || '' }}
      SMOKE_E2E_CHURN_DIR: ${{ inputs.churn_dir || '' }}
    steps:
      - name: Check out smoke scripts only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/installer-smoke
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Read npm latest versions (live)
        shell: bash
        run: node .github/installer-smoke/npm-latest.mjs

      - name: Download official release assets and verify SHA-256
        id: fetch
        if: inputs.artifact_run_id == ''
        shell: bash
        run: node .github/installer-smoke/fetch-verify.mjs

      - name: Download fork build artifact (NON-RELEASE)
        if: inputs.artifact_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fork-build-${{ matrix.id }}
          path: ${{ github.workspace }}/smoke-out/assets
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Locate fork build asset (NON-RELEASE)
        id: forkasset
        if: inputs.artifact_run_id != ''
        shell: bash
        env:
          FORK_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          cd "$SMOKE_OUT/assets"
          if [ "$SMOKE_PLATFORM" = windows ]; then asset=$(ls *.exe); else asset=$(ls *.dmg); fi
          [ "$(printf '%s\n' "$asset" | wc -l)" -eq 1 ]
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const info = JSON.parse(fs.readFileSync("build-info.json", "utf8").replace(/^\uFEFF/, ""));
            const asset = process.argv[1];
            const sha256 = crypto.createHash("sha256").update(fs.readFileSync(asset)).digest("hex");
            if (info.sha256 !== sha256) throw new Error(`sha mismatch vs build-info: ${info.sha256} != ${sha256}`);
            const out = { nonRelease: true, runId: process.env.FORK_RUN_ID, repo: info.repo, ref: info.ref, sourceSha: info.sourceSha, asset, sha256 };
            fs.writeFileSync(process.env.SMOKE_OUT + "/build-source.json", JSON.stringify(out, null, 2));
            console.log(JSON.stringify(out, null, 2));
          ' "$asset"
          echo "asset=$SMOKE_OUT/assets/$asset" >> "$GITHUB_OUTPUT"

      - name: Install FyAgent (Windows, NSIS /S)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SMOKE_ASSET: ${{ steps.fetch.outputs.asset || steps.forkasset.outputs.asset }}
        run: ./.github/installer-smoke/windows.ps1 -Phase install

      - name: Prepare Explorer desktop view (test environment)
        if: matrix.platform == 'windows' && (inputs.restart_explorer == 'all' || (inputs.restart_explorer == 'arm64' && matrix.arch == 'arm64'))
        continue-on-error: true
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .github/installer-smoke/diag-watch.ps1 -Mode explorerprep -Out "$env:SMOKE_OUT" -Dir restart

      - name: Install FyAgent (macOS, dmg copy)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          SMOKE_ASSET: ${{ steps.fetch.outputs.asset || steps.forkasset.outputs.asset }}
        run: ./.github/installer-smoke/macos.sh install

      - name: "E2E: onboarding and one-click installs through FyAgent UI"
        if: env.SMOKE_SCENARIO == 'fyagent-e2e'
        continue-on-error: true
        timeout-minutes: 45
        shell: bash
        run: |
          if [ "$SMOKE_PLATFORM" = windows ]; then
            pwsh -File .github/installer-smoke/windows.ps1 -Phase e2e -Label after-e2e
            pwsh -File .github/installer-smoke/windows.ps1 -Phase opencode-desktop -Label locate
          else
            ./.github/installer-smoke/macos.sh e2e
            ./.github/installer-smoke/macos.sh probe after-e2e
          fi
          node .github/installer-smoke/cli-versions.mjs after-e2e

      - name: Launch and detect (baseline)
        if: env.SMOKE_SCENARIO == 'npm-preinstall'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$SMOKE_PLATFORM" = windows ]; then
            pwsh -File .github/installer-smoke/windows.ps1 -Phase probe -Label baseline
          else
            ./.github/installer-smoke/macos.sh probe baseline
          fi

      - name: Install agent CLIs via npm
        if: env.SMOKE_SCENARIO == 'npm-preinstall'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$SMOKE_PLATFORM" = windows ]; then
            pwsh -File .github/installer-smoke/windows.ps1 -Phase tools
          else
            ./.github/installer-smoke/macos.sh tools
          fi

      - name: Install OpenCode Desktop (official stable installer)
        if: env.SMOKE_SCENARIO == 'npm-preinstall'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$SMOKE_PLATFORM" = windows ]; then
            pwsh -File .github/installer-smoke/windows.ps1 -Phase opencode-desktop
          else
            ./.github/installer-smoke/macos.sh opencode-desktop
          fi

      - name: Launch and detect (after tools)
        if: env.SMOKE_SCENARIO == 'npm-preinstall'
        continue-on-error: true
        shell: bash
        run: |
          if [ "$SMOKE_PLATFORM" = windows ]; then
            pwsh -File .github/installer-smoke/windows.ps1 -Phase probe -Label after-tools
          else
            ./.github/installer-smoke/macos.sh probe after-tools
          fi
          node .github/installer-smoke/cli-versions.mjs after-tools

      - name: Summarize
        if: always()
        shell: bash
        run: node .github/installer-smoke/summarize.mjs

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-smoke-${{ inputs.artifact_run_id && format('fork-{0}', inputs.artifact_run_id) || inputs.tag || 'v0.4.9' }}-${{ inputs.scenario || 'fyagent-e2e' }}-${{ matrix.id }}${{ github.run_attempt > 1 && format('-a{0}', github.run_attempt) || '' }}
          path: |
            smoke-out
            !smoke-out/assets/*.exe
            !smoke-out/assets/*.dmg
          if-no-files-found: warn
          retention-days: 30
