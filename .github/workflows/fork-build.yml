# Fork-only, manual: build UNSIGNED FyAgent installers from a fix branch so the
# installer smoke can test them on throwaway VMs before any release. These
# artifacts are never release assets: no signing, no notarization, no
# manifest, no provenance. installer-smoke.yml consumes them through its
# artifact_run_id input and labels every summary "non-release".
name: Fork Build (unsigned, non-release)

on:
  # The narrow push trigger only registers this non-default-branch workflow;
  # a push build uses the default ref below.
  push:
    branches: [test/installer-smoke]
    paths:
      - .github/workflows/fork-build.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or SHA of junshi-fy/fyagent to build
        required: true
        default: maintenance/windows-install-fixes-20260930
        type: string

permissions:
  contents: read

concurrency:
  group: fork-build-${{ inputs.ref || 'maintenance/windows-install-fixes-20260930' }}
  cancel-in-progress: false

jobs:
  windows:
    name: fork-build-${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            runner: windows-2025
            architecture: x64
            rust_target: x86_64-pc-windows-msvc
          - id: windows-arm64
            runner: windows-11-vs2026-arm
            architecture: arm64
            rust_target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout fix source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || 'maintenance/windows-install-fixes-20260930' }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          target: ${{ matrix.rust_target }}
          cache: false
      - name: Configure native LLVM on Windows ARM64
        if: matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          $llvmBin = 'C:\Program Files\LLVM\bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and bundle unsigned NSIS setup
        shell: pwsh
        env:
          FYAGENT_WINDOWS_MANIFEST: release
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.architecture }}' -eq 'arm64') {
            pnpm tauri build --target '${{ matrix.rust_target }}' --no-bundle
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
            pnpm tauri bundle --target '${{ matrix.rust_target }}' --bundles nsis
            $root = 'src-tauri/target/${{ matrix.rust_target }}/release'
          } else {
            pnpm tauri build --no-bundle
            if ($LASTEXITCODE -ne 0) { throw "build failed" }
            pnpm tauri bundle --bundles nsis
            $root = 'src-tauri/target/release'
          }
          if ($LASTEXITCODE -ne 0) { throw "bundle failed" }
          $setups = @(Get-ChildItem -Path (Join-Path $root 'bundle/nsis') -Recurse -Filter *.exe -File)
          if ($setups.Count -ne 1) { throw "expected one setup, found $($setups.Count)" }
          New-Item -ItemType Directory -Force out | Out-Null
          $sha = (git rev-parse HEAD).Trim()
          $name = "FyAgent-fork-$($sha.Substring(0,8))-Windows-${{ matrix.architecture }}-setup.exe"
          Copy-Item $setups[0].FullName (Join-Path out $name)
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path out $name)).Hash.ToLowerInvariant()
          [ordered]@{ repo = '${{ github.repository }}'; ref = '${{ inputs.ref || 'maintenance/windows-install-fixes-20260930' }}'; sourceSha = $sha; asset = $name; sha256 = $hash; signed = $false; nonRelease = $true } |
            ConvertTo-Json | Set-Content -Encoding utf8 out/build-info.json
          Get-Content out/build-info.json
      - name: Upload fork build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-build-${{ matrix.id }}
          path: out
          if-no-files-found: error
          retention-days: 14

  macos:
    name: fork-build-macos-arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout fix source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || 'maintenance/windows-install-fixes-20260930' }}
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.97.1
          target: aarch64-apple-darwin
          cache: false
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build unsigned arm64 app and DMG
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --target aarch64-apple-darwin --bundles app
          app=src-tauri/target/aarch64-apple-darwin/release/bundle/macos/FyAgent.app
          test -d "$app"
          codesign --force --deep -s - "$app"
          mkdir -p out stage
          cp -R "$app" stage/
          sha=$(git rev-parse HEAD)
          name="FyAgent-fork-${sha:0:8}-macOS-arm64.dmg"
          hdiutil create -volname FyAgent -srcfolder stage -ov -format UDZO "out/$name"
          hash=$(shasum -a 256 "out/$name" | cut -d' ' -f1)
          printf '{"repo":"%s","ref":"%s","sourceSha":"%s","asset":"%s","sha256":"%s","signed":false,"nonRelease":true}\n' \
            "${{ github.repository }}" "${{ inputs.ref || 'maintenance/windows-install-fixes-20260930' }}" "$sha" "$name" "$hash" > out/build-info.json
          cat out/build-info.json
      - name: Upload fork build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fork-build-macos-arm64
          path: out
          if-no-files-found: error
          retention-days: 14
